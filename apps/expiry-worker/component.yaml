apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: expiry-worker
  description: Cloudflare Worker for the Expiry runtime — tracked items and their reminder ladder
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/expiry-worker
  dependsOn:
    # Runbook trap 21: the migration deploys before code that reads its tables.
    - component: db-migrate
    # EX3: the DOCUMENTS binding names a bucket this component creates.
    - component: cloudflare-r2
    - component: notifications-worker
    - component: membership-worker
    - component: policy-worker
    - component: billing-worker
  # BF6 wiring documents from orun secrets (SEC-JOB): lease-published by
  # the infra components; wire-live renders the wrangler template from
  # these instead of Secrets Manager documents.
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://ws_Q6C9EPM3/expirio/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://ws_Q6C9EPM3/expirio/prod/WIRING_CLOUDFLARE_D1"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the Secrets Manager wiring manifest (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: expirio

    turboFilter: "@saas/expiry-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-d1"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/expiry-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/expiry-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: expiry
    runtime: cloudflare
# redeploy: EX-3 carries the cirrus D1 fix (appendEventWithAudit + membership writes, no Postgres-only SQL)
