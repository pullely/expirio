apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: EX-8
spec:
  goal: The expirio console has its own visual identity from factory THEMES.md instead of the inherited cirrus theme.
  affects:
    - default/expirio/web-console-next
  doneWhen:
    - 'globals.css carries the THEMES.md expirio light and dark tokens, and no Inter font stack'
    - 'layout.tsx loads Manrope with next/font/google, exposed as --font-sans on html'
    - 'the console defaults to light mode'
    - 'the login, onboarding and demo badges show the hourglass mark on solid bg-primary, not the letter S'
    - 'app/icon.svg is the favicon, and the manifest and PRODUCT_DESCRIPTION carry the openproduct tagline'
    - 'primary-fg on primary, fg on bg and muted-fg on bg are each at least 4.5:1 in both modes'
  gates: []
